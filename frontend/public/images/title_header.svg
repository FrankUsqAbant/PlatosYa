<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      
      .brand-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: -1.5px;
      }
      
      .brand-subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 0.5px;
      }
      
      .glow {
        filter: drop-shadow(0 0 25px rgba(255, 94, 54, 0.45));
      }
    </style>
    
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E36" />
      <stop offset="50%" stop-color="#FF9F1C" />
      <stop offset="100%" stop-color="#FF2E63" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Background decorative glow -->
  <circle cx="425" cy="50" r="120" fill="#FF5E36" opacity="0.08" filter="blur(40px)" />

  <!-- Logo Title -->
  <g class="glow" text-anchor="middle">
    <text x="425" y="68" class="brand-title">
      <tspan fill="#FFFFFF">🍽️ Plato</tspan><tspan fill="url(#fireGrad)">Ya</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="425" y="108" class="brand-subtitle" fill="url(#subGrad)">
      Cocina de Autor y Pedidos en Tiempo Real
    </text>
  </g>
</svg>
